[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["teleop_xr"]
artifacts = ["teleop_xr/cert.pem", "teleop_xr/key.pem"]

[tool.uv.sources]
pyroki = { path = "../pyroki", editable = true }
ballpark = { git = "https://github.com/chungmin99/ballpark.git" }

[tool.hatch.build.targets.sdist]
exclude = [
  "webxr/node_modules",
  "webxr/out",
  "webxr/.vite",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[project]
name = "teleop-xr"
version = "1.3.6.dev3+openarm"
requires-python = ">=3.10"
description = "Turns your phone into a robot arm teleoperation device by leveraging the WebXR API"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
authors = [{ name = "Qrafty AI", email = "contact@qrafty-ai.com" }]
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "numpy",
  "transforms3d",
  "requests",
  "websocket-client",
  "aiortc",
  "opencv-python",
  "av",
  "rich>=13.0.0",
  "tyro>=0.8.0",
  "pydantic>=2.0.0",
  "loguru>=0.7.3",
  "typing-extensions>=4.0.0; python_version < '3.12'",
]

[project.urls]
Documentation = "https://github.com/qrafty-ai/teleop_xr"
Source = "https://github.com/qrafty-ai/teleop_xr"
Tracker = "https://github.com/qrafty-ai/teleop_xr/issues"

[project.optional-dependencies]
ram = [
  "gitpython>=3.1.46",
  "xacro>=2.1.1",
  "filelock>=3.20.3",
  "trimesh[easy]>=4.0.0",
]
ik = [
  "jax>=0.6.2",
  "pyroki",
  "ballpark",
  "jaxlie",
  "jaxls",
  "spatialmath-python>=1.1.15",
  "viser>=1.0.21",
  "yourdfpy>=0.0.60",
  "pin",
  "teleop-xr[ram]",
]
cuda = [
  "jax[cuda12]>=0.6.2",
]

[project.entry-points."teleop_xr.robots"]
h1 = "teleop_xr.ik.robots.h1_2:UnitreeH1Robot"
franka = "teleop_xr.ik.robots.franka:FrankaRobot"
openarm = "teleop_xr.ik.robots.openarm:OpenArmRobot"
so101 = "teleop_xr.ik.robots.so101:SO101Robot"
teaarm = "teleop_xr.ik.robots.teaarm:TeaArmRobot"
vega = "teleop_xr.ik.robots.vega:DexmateVegaRobot"
