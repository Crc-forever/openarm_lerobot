[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["teleop_xr"]
artifacts = ["teleop_xr/cert.pem", "teleop_xr/key.pem"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[project]
name = "teleop-xr"
version = "1.3.6.dev3+openarm"
requires-python = ">=3.10"
description = "Turns your phone into a robot arm teleoperation device by leveraging the WebXR API"
readme = { text = "OpenArm-specific TeleopXR runtime.", content-type = "text/markdown" }
license = { file = "LICENSE" }
authors = [{ name = "Qrafty AI", email = "contact@qrafty-ai.com" }]
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "numpy",
  "transforms3d",
  "requests",
  "websocket-client",
  "aiortc",
  "opencv-python",
  "av",
  "rich>=13.0.0",
  "tyro>=0.8.0",
  "pydantic>=2.0.0",
  "loguru>=0.7.3",
  "typing-extensions>=4.0.0; python_version < '3.12'",
]

[project.urls]
Documentation = "https://github.com/qrafty-ai/teleop_xr"
Source = "https://github.com/qrafty-ai/teleop_xr"
Tracker = "https://github.com/qrafty-ai/teleop_xr/issues"

[project.entry-points."teleop_xr.robots"]
openarm = "teleop_xr.ik.robots.openarm:OpenArmRobot"
