[project]
name = "openarm-control-env"
version = "0.1.0"
description = "Reproducible OpenArm LeRobot control and recording runtime"
requires-python = "==3.12.*"
dependencies = [
  "lerobot[core-scripts,openarms]==0.6.0",
  "numpy==2.2.6",
  "python-can==4.6.1",
  "torch==2.7.1+cu118",
  "torchcodec==0.5",
  "torchvision==0.22.1+cu118",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
